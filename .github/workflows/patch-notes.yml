name: Patch Notes

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      week:
        description: ISO week to (re)generate, e.g. 2026-W41. Empty means the week that just ended.
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: patch-notes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The script needs no dependencies, so there is no install step.
      - name: Generate the issue
        id: notes
        run: node scripts/patch-notes.mjs
        env:
          PATCH_NOTES_WEEK: ${{ inputs.week }}

      - name: Commit if something changed
        run: |
          git add src/content/docs/patch-notes
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish Patch Notes for ${{ steps.notes.outputs.issue }}"
          git push
